<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Tech Quiz 2026 - Participant Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <div class="card auth-card">
      <div class="card-header">
        <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 50px; height: 50px; font-size: 1.5rem;">Q</div>
        <h2>Participant Login</h2>
        <p>Annual Inter-College Technical Quiz Competition</p>
      </div>

      <div class="card-body">
        <div id="loginAlert" class="alert-message alert-danger" role="alert">
          Please fill in all required fields.
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="participantName">Participant Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input 
                type="text" 
                id="participantName" 
                class="form-input" 
                placeholder="e.g., Alex Johnson" 
                autocomplete="name" 
                required
              >
            </div>
            <span class="input-help">Enter your name as registered with the college event.</span>
          </div>

          <div class="form-group">
            <label for="participantId">Participant ID / Roll Number</label>
            <div class="input-wrapper">
              <span class="input-icon">🆔</span>
              <input 
                type="text" 
                id="participantId" 
                class="form-input" 
                placeholder="e.g., TECH-2026-042" 
                autocomplete="off" 
                required
              >
            </div>
            <span class="input-help">Provide your allocated ID or college roll number.</span>
          </div>

          <button type="submit" id="loginBtn" class="btn btn-primary btn-block" style="padding: 0.95rem; font-size: 1.05rem;">
            Proceed to Instructions →
          </button>
        </form>
      </div>

      <div class="card-footer" style="justify-content: center; text-align: center;">
        <span style="font-size: 0.8rem; color: var(--slate-500);">
          Secure Participant Portal • Pure Frontend Interface
        </span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
